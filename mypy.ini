[mypy]
python_version = 3.9
ignore_missing_imports = True
warn_unused_configs = True
disallow_untyped_defs = False
# Match the DBMind rollout policy: production Python only, not tests or docs.
exclude = (^tests/|^doc/|^examples/|^opensearch_sdk/(doc|examples)/|^opensearch_sdk/opensearch_sdk/tests/)
